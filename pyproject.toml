[project]
name = "doublecheck"
version = "1.0.0"
description = "Scam protection for Indian users: call co-pilot, UPI guard, Telegram family bot and AI guard."
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, modern syntax, simplifications
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# rule/message tables hold long regexes and full sentences on purpose
"app/rules.py" = ["E501"]
"app/messages.py" = ["E501"]
"app/bot_text.py" = ["E501"]
"app/links.py" = ["E501"]
"app/llm.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
